name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: "stable"

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze

      # Goldens are pixel-exact against renders made on macOS, the reference
      # platform: they run in the `goldens` job below. See docs/TESTING.md.
      - run: flutter test --exclude-tags golden

  goldens:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: "stable"

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter test --tags golden

      # Expected/actual/diff images, to see what changed without rerunning
      # locally.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
