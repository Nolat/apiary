name: apiary
description: "Apiary - a relaxing merge game where you raise bees, cross species to discover new ones and fulfil daily orders."

publish_to: "none"

version: 0.0.1+1

environment:
  sdk: ^3.13.0

dependencies:
  clock: ^1.1.3
  cloud_firestore: ^6.8.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  easy_localization: ^3.0.8
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  sentry_flutter: ^10.2.0
  talker_flutter: ^5.1.13

dev_dependencies:
  build_runner: ^2.10.5
  drift_dev: ^2.34.5
  firebase_auth_mocks: ^0.15.2
  flame_test: ^2.3.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
  glados: ^1.1.7
  import_sorter: ^4.6.0
  mocktail: ^1.0.5
  patrol: ^4.10.0
  riverpod_generator: ^4.0.0+1
  sentry_dart_plugin: ^3.4.0
  shared_preferences: ^2.5.5
  very_good_analysis: ^10.0.0

import_sorter:
  emojis: true
  comments: true

# sentry_dart_plugin: uploads debug symbols after a release build — run by the
# fastlane `release` lanes (ios/fastlane, android/fastlane). The auth token comes from SENTRY_AUTH_TOKEN, never
# from this file.
sentry:
  org: fr-nolat-apiary
  project: apiary
  # Matches the release sentry_flutter reports: <bundle id>@<version>+<build>.
  name: fr.nolat.apiary
  upload_debug_symbols: true
  upload_sources: true
  symbols_path: build/debug-info
  # No repository is connected to the Sentry org yet.
  commits: "false"

flutter:
  uses-material-design: true
  assets:
    - assets/images/bees/
    - assets/images/board/
    - assets/images/generators/
    - assets/translations/

# Patrol E2E tests (patrol_test/), run with `patrol test` — see docs/TESTING.md.
patrol:
  app_name: Apiary
  android:
    package_name: fr.nolat.apiary
  ios:
    bundle_id: fr.nolat.apiary
